[package]
name = "typesetter_native"
version = "0.1.0"
edition = "2021"
description = "Native core for the Typesetter SDF text addon (font loading, distance-field generation, atlas packing, rich text, layout, mesh building)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
skrifa = "0.49"
fdsm = "0.8"
image = { version = "0.25", default-features = false }
nalgebra = "0.34"
rayon = "1.12"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# Tests and benches exercise the pure-Rust core; keep them fast.
[profile.test]
opt-level = 2
